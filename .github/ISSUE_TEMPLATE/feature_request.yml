name: Feature request
description: Suggest an improvement or new capability.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Check existing issues first so related ideas can be discussed together.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Explain who would benefit and what is difficult today.
      placeholder: As a user, I want ... so that ...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
      description: Describe the feature or improvement you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or extra context
      description: Mention other approaches, examples, or relevant screenshots.
    validations:
      required: false
